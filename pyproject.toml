[project]
name = "marimo-primer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "altair>=6.3.0",
    "geopandas>=1.1.4",
    "geopy>=2.5.0",
    "marimo>=0.23.0",
    "orjson>=3.12.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pyglobegl[geopandas]>=0.9.2",
    "typer>=0.27.2",
]

[tool.uv]
exclude-newer = "7 days"
# pyglobegl 0.9.2 fixes polygon winding (#7); drop after 2026-10-08
exclude-newer-package = { pyglobegl = false }
